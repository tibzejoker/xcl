# any%5 merge queue CI. `anyp5 setup --test "CMD"` writes it with your test command; or copy it to
# .github/workflows/anyp5-ci.yml and put the command in the last step (see docs/GITMODE.md). With this file on the project branch, the coordinator stops pushing
# approved changes straight to it: it pushes each batch to the anyp5-queue branch, starts this workflow there,
# and fast-forwards the project branch only to a candidate whose `anyp5-ci` check run succeeded.
#
# Started with workflow_dispatch because a push made with the coordinator's GITHUB_TOKEN starts no workflow.
# This runs contributor code: it gets no secrets and a read-only token. Batches never hold changes under
# .github/, so the workflow that runs is always the one already on the project branch.
name: anyp5-ci
on:
  workflow_dispatch:
concurrency:
  group: anyp5-ci
  cancel-in-progress: true   # a newer candidate replaces the old one; a cancelled run is retried
permissions:
  contents: read
jobs:
  anyp5-ci:                  # the check run name the coordinator reads (ci.check in anyp5.json)
    runs-on: windows-2025   # same runner as the project's own CI
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    timeout-minutes: 55      # keep under ci.timeout_minutes (default 60)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust (stable, MSVC)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      # Replace with the project's own build and tests. A missing command fails, so nothing lands by mistake.
      - name: Test
        shell: pwsh
        run: |
          ./scripts/test.ps1 --skip test_title_runs_and_game_folder_is_untouched
